<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <title>Vyuha Finance — Page Not Found</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #a7bfe8, #619aed);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2rem;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #1e293b; }
        p { opacity: 0.9; margin-bottom: 1.5rem; }
        a {
            display: inline-block;
            background: #6366f1;
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist.</p>
        <a href="javascript:void(0);" onclick="window.location.href='./'">Go to Dashboard</a>
    </div>
    <script>
        // Redirect to home if service worker is available
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then(() => {
                window.location.href = './';
            });
        }
    </script>
</body>
</html>
