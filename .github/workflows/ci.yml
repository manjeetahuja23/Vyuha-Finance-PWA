name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Bun
      run: |
        curl -fsSL https://bun.sh/install | bash
        echo "PATH=$HOME/.bun/bin:$PATH" >> $GITHUB_ENV

    - name: Install UI/UX Skill Dependencies
      working-directory: ./skills/ui-ux-pro-max-skill/cli # Relative path to the skill's cli dir
      run: bun install

    - name: Run UI/UX Tests
      working-directory: ./ # Run from the project root (finance-app)
      run: ./test.sh

  deploy:
    needs: build-and-test
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ # Publish the root of the repository
          publish_branch: gh-pages # Or your chosen publishing branch
